name: 產生實境 3D 圖資
on:
  schedule:
    - cron: '47 20 * * 0'   # 每週一 04:47(台灣時間)
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['real.py', '.github/workflows/real.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: 安裝套件
        run: pip install osmium shapely pillow
      - name: 下載台灣 OpenStreetMap 資料
        run: curl -fL --retry 5 -o taiwan.osm.pbf https://download.geofabrik.de/asia/taiwan-latest.osm.pbf
      - name: 產生實境 3D 圖資(道路車道、標線、高架/地下道高度、建築、地形)
        env: { TERR_DL: '1' }
        run: mkdir -p terr out && python3 real.py taiwan.osm.pbf terr out
      - name: "發佈到 Releases(標籤 real)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view real >/dev/null 2>&1 || gh release create real --title "實境 3D 圖資" --notes "行跡導航實境 3D 圖資,每週自動更新。"
          cd out && ls *.gz | xargs -n 60 gh release upload real --clobber && gh release upload real real.json --clobber
          gh release edit real --notes "行跡導航實境 3D 圖資(每 0.1° 一包),由 OpenStreetMap 與 AWS Terrain Tiles(Terrarium)自動產生,每週更新。最後更新:$(date -u +%Y-%m-%dT%H:%MZ)。資料 © OpenStreetMap contributors (ODbL);地形 © Mapzen/AWS Terrain Tiles 各來源(SRTM 等)。"
