name: 區間測速資料探查
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -c "import urllib.parse" && python3 tools/secprobe.py
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          tar czf probe.tgz probe
          gh release view probe >/dev/null 2>&1 || gh release create probe --title probe --notes probe --latest=false
          gh release upload probe probe.tgz --clobber
