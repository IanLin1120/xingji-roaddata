name: 區間測速資料探查
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install osmium
      - run: curl -fL --retry 5 -o taiwan.osm.pbf https://download.geofabrik.de/asia/taiwan-latest.osm.pbf
      - run: mkdir -p probe && python3 tools/secosm.py taiwan.osm.pbf probe/osm_sec.json
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gzip -9 probe/osm_sec.json
          gh release view probe >/dev/null 2>&1 || gh release create probe --title probe --notes probe --latest=false
          gh release upload probe probe/osm_sec.json.gz --clobber
